services:
  app:
    build: ./server
    container_name: campustask-app
    env_file: ./server/.env
    environment:
      DATABASE_URL: mysql+pymysql://campustask:campustask@mysql:3306/campustask?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: campustask-mysql
    environment:
      MYSQL_DATABASE: campustask
      MYSQL_USER: campustask
      MYSQL_PASSWORD: campustask
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucampustask", "-pcampustask"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: campustask-redis
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: campustask-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql_data:
